<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed</title>

<!-- Standard Clean Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Inter', sans-serif;
    background-color: #ffffff;
    color: #111827;
    margin: 0;
    padding: 40px 20px;
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  /* Simple Green Success Circle */
  .success-icon {
    width: 60px;
    height: 60px;
    background-color: #dcfce7;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .success-icon svg {
    width: 30px;
    height: 30px;
    fill: none;
    stroke: #16a34a;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 5px 0;
  }

  .status-tag {
    font-size: 14px;
    font-weight: 600;
    color: #16a34a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 30px;
  }

  .message-content {
    max-width: 440px;
    margin-bottom: 40px;
  }

  .main-text-hi {
    font-size: 18px;
    font-weight: 600;
    color: #1f2937;
    margin: 0 0 10px 0;
  }

  .sub-text-hi {
    font-size: 15px;
    color: #4b5563;
    line-height: 1.6;
    margin: 0;
  }

  /* Clean Minimal Button */
  .btn-home {
    display: inline-block;
    background-color: #111827;
    color: #ffffff;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 30px;
    border-radius: 8px;
    text-decoration: none;
    transition: background-color 0.2s ease;
  }

  .btn-home:hover {
    background-color: #1f2937;
  }
</style>
</head>
<body>

  <!-- Success Tick Icon -->
  <div class="success-icon">
    <svg viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>

  <!-- English Headings -->
  <h1>Thank You!</h1>
  <div class="status-tag">Booking Successful</div>

  <!-- Mixed Clean Message -->
  <div class="message-content">
    <p class="main-text-hi">आपकी बुकिंग हमें मिल गई है।</p>
    <p class="sub-text-hi">हमारी टीम अगले <b>5 मिनट</b> में आपको कॉल करेगी और सर्विस की पूरी जानकारी दी जाएगी।</p>
  </div>

  <!-- Back Link Button -->
  <a href="index.html" class="btn-home">
    Back to Homepage
  </a>

</body>
</html>
